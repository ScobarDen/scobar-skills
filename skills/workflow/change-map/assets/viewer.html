<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Change map</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
  --accent: #2563eb; --on-accent: #ffffff; --must: #dc2626; --skim: #d97706; --noise: #a8a29e;
  --add-bg: #dcfce7; --add-fg: #166534; --del-bg: #fee2e2; --del-fg: #991b1b; --hunk: #4338ca;
  --sketch: #f59e0b;
  accent-color: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --line: #44403c;
    --accent: #60a5fa; --on-accent: #0c0a09; --must: #f87171; --skim: #fbbf24; --noise: #78716c;
    --add-bg: #052e16; --add-fg: #86efac; --del-bg: #450a0a; --del-fg: #fca5a5; --hunk: #a5b4fc;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
header { padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0 0 4px; font-size: 18px; }
header p { margin: 0; color: var(--muted); }
.warn { margin-top: 8px; padding: 8px 12px; border-left: 3px solid var(--must); background: var(--del-bg); color: var(--del-fg); }
nav.tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
nav.tabs button { border: 0; background: none; color: var(--muted); padding: 10px 14px; border-bottom: 2px solid transparent; }
nav.tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
main { padding: 24px; max-width: 1400px; margin: 0 auto; }
.tier { margin-bottom: 32px; }
.tier > h2 { font-size: 15px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
.dot { inline-size: 10px; block-size: 10px; border-radius: 50%; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.card.reviewed { background: var(--bg); border-style: dashed; }
.card.reviewed .card-body { display: none; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
.card-head code { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.why { margin: 6px 0; }
.label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 10px; }
.contract { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.contract pre { margin: 4px 0 0; }
.consumers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.consumers code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 12px; overflow-wrap: anywhere; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font: 12px/1.45 ui-monospace, monospace; }
pre .add { background: var(--add-bg); color: var(--add-fg); display: block; }
pre .del { background: var(--del-bg); color: var(--del-fg); display: block; }
pre .hunk { color: var(--hunk); display: block; }
details summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
.noise-list { color: var(--muted); overflow-wrap: anywhere; }
.ui { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
.ui aside button { display: block; inline-size: 100%; text-align: start; border: 1px solid transparent; border-inline-start: 3px solid transparent; background: none; padding: 8px 10px; border-radius: 6px; }
.ui aside button[aria-current="true"] { background: var(--panel); border-color: var(--line); border-inline-start-color: var(--accent); font-weight: 600; }
.ui aside small { display: block; color: var(--muted); font-weight: 400; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; }
.seg button:first-child { border-start-start-radius: 5px; border-end-start-radius: 5px; }
.seg button:last-child { border-start-end-radius: 5px; border-end-end-radius: 5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.hint { color: var(--muted); font-size: 12px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.badge.render { background: var(--add-bg); color: var(--add-fg); }
.badge.sketch { background: var(--sketch); color: #000; }
.sketch-banner { padding: 8px 12px; border: 2px dashed var(--sketch); border-radius: 6px; margin-bottom: 12px; }
.stages { display: flex; flex-wrap: wrap; gap: 16px; align-items: start; }
.stage { position: relative; display: inline-grid; max-inline-size: 100%; margin-top: 22px; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 6px; }
.stage > :not(.tag) { grid-area: 1 / 1; }
.stage img { display: block; max-inline-size: 100%; }
.stage .tag { position: absolute; top: -20px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stage .placeholder { padding: 48px 64px; color: var(--muted); }
input[type="range"] { inline-size: min(100%, 480px); }
@media (max-width: 760px) { .ui { grid-template-columns: 1fr; } .contract { grid-template-columns: 1fr; } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <div id="warn"></div>
</header>
<nav class="tabs" aria-label="View" id="tabs"></nav>
<main id="main"></main>
<p class="sr-only" role="status" id="announce"></p>
<script src="data.js"></script>
<script>
const data = window.CHANGE_MAP;
const TIERS = [
  { id: 'must', title: 'Must look', color: 'var(--must)' },
  { id: 'skim', title: 'Skim', color: 'var(--skim)' },
  { id: 'noise', title: 'Noise', color: 'var(--noise)' },
];
const SIDE_LABEL = { before: 'Before', after: 'After' };
const MODE_LABEL = { flip: 'Flip', split: 'Side by side', curtain: 'Curtain' };

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else if (value !== undefined && value !== null && value !== false) node.setAttribute(name, value);
  }
  node.append(...kids.flat().filter(kid => kid !== undefined && kid !== null && kid !== false));
  return node;
};
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {} },
};
const reviewKey = id => `change-map:${data.title}:${id}`;

function redrawKeepingFocus(redraw) {
  const focusKey = document.activeElement?.dataset?.focusKey;
  redraw();
  if (focusKey) document.querySelector(`[data-focus-key="${CSS.escape(focusKey)}"]`)?.focus();
}

function diffBlock(text) {
  const pre = el('pre');
  for (const line of text.split('\n')) {
    const cls = line.startsWith('@@') ? 'hunk'
      : line.startsWith('+') && !line.startsWith('+++') ? 'add'
      : line.startsWith('-') && !line.startsWith('---') ? 'del' : null;
    pre.append(cls ? el('span', { class: cls }, line) : line + '\n');
  }
  return pre;
}

function moduleCard(module) {
  const box = el('input', { type: 'checkbox', 'aria-label': `Mark ${module.name} reviewed` });
  box.checked = store.get(reviewKey(module.id)) === '1';
  const consumers = module.consumers || [];
  const consumersTotal = module.consumersTotal || consumers.length;
  const card = el('article', { class: 'card' },
    el('div', { class: 'card-head' },
      el('label', {}, box, ' ', el('strong', {}, module.name)),
      el('code', {}, module.path)),
    el('div', { class: 'card-body' },
      module.why && el('p', { class: 'why' }, module.why),
      module.contract && el('div', {},
        el('div', { class: 'label' }, 'Contract'),
        el('div', { class: 'contract' },
          el('div', {}, el('span', { class: 'hint' }, 'before'), el('pre', {}, module.contract.before || '—')),
          el('div', {}, el('span', { class: 'hint' }, 'after'), el('pre', {}, module.contract.after || '—')))),
      consumers.length > 0 && el('div', {},
        el('div', { class: 'label' }, `Consumers · ${consumersTotal}`),
        el('div', { class: 'consumers' },
          consumers.map(path => el('code', {}, path)),
          consumersTotal > consumers.length && el('span', { class: 'hint' }, `+${consumersTotal - consumers.length} more`))),
      module.diff && el('details', {}, el('summary', {}, `Diff of ${module.name}`), diffBlock(module.diff))));
  card.classList.toggle('reviewed', box.checked);
  box.addEventListener('change', () => {
    store.set(reviewKey(module.id), box.checked ? '1' : null);
    card.classList.toggle('reviewed', box.checked);
  });
  return card;
}

function renderCode(root) {
  for (const tier of TIERS) {
    const tierModules = data.modules.filter(module => module.tier === tier.id);
    if (tierModules.length === 0) continue;
    root.append(el('section', { class: 'tier' },
      el('h2', {}, el('span', { class: 'dot', style: `background:${tier.color}` }), `${tier.title} · ${tierModules.length}`),
      tier.id === 'noise'
        ? el('p', { class: 'noise-list' }, tierModules.map(module => module.path).join(', '))
        : tierModules.map(moduleCard)));
  }
}

let onUiKey = null;
function renderUi(root) {
  const screens = data.screens;
  const view = { screen: 0, variant: 0, side: 'after', mode: 'flip', curtain: 50 };
  const list = el('aside');
  const pane = el('section');
  root.append(el('div', { class: 'ui' }, list, pane));

  const picture = (screen, src, side) => src
    ? el('img', { src, alt: `${screen.name}, ${side}` })
    : el('div', { class: 'placeholder' }, side === 'before' ? 'Did not exist before' : 'Removed');

  const segmented = (key, options) => el('div', { class: 'seg' }, options.map(([value, label]) => el('button', {
    'aria-pressed': view[key] === value ? 'true' : 'false',
    'data-focus-key': `${key}:${value}`,
    onclick: () => update({ [key]: value }),
  }, label)));

  function stagesFor(screen, variant) {
    if (view.mode === 'flip') {
      return el('div', { class: 'stage' }, picture(screen, variant[view.side], view.side),
        el('span', { class: 'tag', style: 'left:0' }, view.side));
    }
    if (view.mode === 'split') {
      return el('div', { class: 'stages' }, ['before', 'after'].map(side => el('div', { class: 'stage' },
        picture(screen, variant[side], side), el('span', { class: 'tag', style: 'left:0' }, side))));
    }
    return el('div', { class: 'stage' }, picture(screen, variant.before, 'before'),
      el('div', { class: 'over', style: `clip-path: inset(0 0 0 ${view.curtain}%)` }, picture(screen, variant.after, 'after')),
      el('span', { class: 'tag', style: 'left:0' }, 'before'),
      el('span', { class: 'tag', style: 'right:0' }, 'after'));
  }

  function curtainSlider(stage) {
    const valueText = value => `${100 - value}% before, ${value}% after`;
    const range = el('input', { type: 'range', min: 0, max: 100, value: view.curtain, 'aria-label': 'Curtain position', 'aria-valuetext': valueText(view.curtain) });
    range.addEventListener('input', () => {
      view.curtain = Number(range.value);
      range.setAttribute('aria-valuetext', valueText(view.curtain));
      stage.querySelector('.over').style.clipPath = `inset(0 0 0 ${view.curtain}%)`;
    });
    return el('div', {}, range);
  }

  function draw() {
    const screen = screens[view.screen];
    const variant = screen.states[view.variant] || screen.states[0];
    list.replaceChildren(...screens.map((item, index) => el('button', {
      'aria-current': index === view.screen ? 'true' : 'false',
      'data-focus-key': `screen:${index}`,
      onclick: () => update({ screen: index, variant: 0 }),
    }, item.name, el('small', {}, item.kind, item.usedOn?.length ? ` · ${item.usedOn.join(', ')}` : ''))));

    const stage = variant ? stagesFor(screen, variant) : el('p', { class: 'hint' }, 'No pictures for this piece.');
    pane.replaceChildren(el('div', {},
      el('div', { class: 'toolbar' },
        el('strong', {}, screen.name),
        el('span', { class: `badge ${screen.kind}` }, screen.kind === 'sketch' ? 'SKETCH' : 'RENDER'),
        screen.states.length > 1 && segmented('variant', screen.states.map((state, index) => [index, state.name])),
        segmented('mode', Object.entries(MODE_LABEL)),
        view.mode === 'flip' && segmented('side', Object.entries(SIDE_LABEL)),
        el('span', { class: 'hint' }, 'Space: flip · ←/→: screen')),
      screen.kind === 'sketch' && el('div', { class: 'sketch-banner' },
        'Sketch drawn by the agent from the code, not a render of the component. ', screen.note || ''),
      screen.kind !== 'sketch' && screen.note && el('p', { class: 'hint' }, screen.note),
      stage,
      variant && view.mode === 'curtain' && curtainSlider(stage),
      screen.diff && el('details', {}, el('summary', {}, `Markup and style diff of ${screen.name}`), diffBlock(screen.diff))));

    const showing = view.mode === 'flip' ? SIDE_LABEL[view.side] : MODE_LABEL[view.mode];
    document.getElementById('announce').textContent = `${screen.name}, ${variant?.name ?? 'no pictures'}, ${showing}`;
  }

  function update(changes) {
    Object.assign(view, changes);
    redrawKeepingFocus(draw);
  }

  document.removeEventListener('keydown', onUiKey);
  onUiKey = event => {
    if (event.target.closest?.('input, textarea, select')) return;
    if (event.key === ' ') {
      if (event.target.closest?.('button, summary, a')) return;
      event.preventDefault();
      update({ mode: 'flip', side: view.side === 'after' ? 'before' : 'after' });
    } else if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
      const step = event.key === 'ArrowRight' ? 1 : -1;
      update({ screen: (view.screen + step + screens.length) % screens.length, variant: 0 });
    }
  };
  document.addEventListener('keydown', onUiKey);
  draw();
}

document.getElementById('title').textContent = data.title;
document.getElementById('subtitle').textContent = [data.summary, `${data.base} → ${data.head}`].filter(Boolean).join(' · ');
if (data.split) document.getElementById('warn').append(el('div', { class: 'warn' }, data.split));

const tabs = [];
if (data.screens?.length) tabs.push({ id: 'ui', label: `UI · ${data.screens.length}`, render: renderUi });
tabs.push({ id: 'code', label: `Code · ${data.modules.length}`, render: renderCode });
const main = document.getElementById('main');

function openTab(id) {
  store.set('change-map:tab', id);
  document.removeEventListener('keydown', onUiKey);
  redrawKeepingFocus(() => {
    document.getElementById('tabs').replaceChildren(...tabs.map(tab => el('button', {
      'aria-pressed': tab.id === id ? 'true' : 'false',
      'data-focus-key': `tab:${tab.id}`,
      onclick: () => openTab(tab.id),
    }, tab.label)));
    const panel = el('div');
    main.replaceChildren(panel);
    tabs.find(tab => tab.id === id).render(panel);
  });
}
const savedTab = store.get('change-map:tab');
openTab(tabs.some(tab => tab.id === savedTab) ? savedTab : tabs[0].id);
</script>
</body>
</html>
